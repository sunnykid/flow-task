# Task Flow Web 서버 Nginx 설정
# 설치 위치: /etc/nginx/sites-available/task-flow (sites-enabled에 링크)
# 화면 파일은 /var/www/task-flow에서 제공하고 /api 요청은 App 서버(T13, 8000)로 전달한다.
# APP_SERVER_ADDR은 설치할 때 App 서버 주소로 바꾼다(WEB-SERVER.md 3단계).

upstream task_flow_api {
    server APP_SERVER_ADDR:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/task-flow;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # 설명 최대 2000자(utf8 최대 4바이트) 요청이 들어갈 크기
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    # proxy_pass에 경로를 붙이지 않아 /api/... 경로를 그대로 전달한다.
    location /api/ {
        proxy_pass http://task_flow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
